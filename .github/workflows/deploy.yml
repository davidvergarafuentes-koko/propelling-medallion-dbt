# CD: after a pull request is merged, rebuild the real layers and publish the dbt docs site.
name: dbt Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deployment at a time, and none is cancelled halfway.
concurrency:
  group: dbt-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DBT_TARGET: dev
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dbt
        run: pip install -r requirements.txt

      - name: Write the Snowflake private key to a temporary file
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s\n' "$SNOWFLAKE_PRIVATE_KEY" > "$RUNNER_TEMP/dbt_key.p8"
          echo "SNOWFLAKE_PRIVATE_KEY_PATH=$RUNNER_TEMP/dbt_key.p8" >> "$GITHUB_ENV"

      - name: Install dbt packages
        run: dbt deps

      - name: Build and test the real layers
        run: dbt build

      - name: Generate the docs site as one file
        run: |
          dbt docs generate --static
          mkdir site
          cp target/static_index.html site/index.html

      - name: Hand the site to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  publish-docs:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the docs
        id: deployment
        uses: actions/deploy-pages@v5
