# CI: every pull request builds and tests the whole project in schemas of its own,
# such as CI_PR_42_BRONZE, so a broken change can never reach BRONZE, SILVER or GOLD.
name: dbt CI

on:
  pull_request:
    branches: [main]

# Runs for the same pull request wait in line, so one run's cleanup cannot remove another's tables.
concurrency:
  group: dbt-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DBT_TARGET: ci
      DBT_CI_SCHEMA: ci_pr_${{ github.event.pull_request.number }}
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dbt
        run: pip install -r requirements.txt

      - name: Write the Snowflake private key to a temporary file
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s\n' "$SNOWFLAKE_PRIVATE_KEY" > "$RUNNER_TEMP/dbt_key.p8"
          echo "SNOWFLAKE_PRIVATE_KEY_PATH=$RUNNER_TEMP/dbt_key.p8" >> "$GITHUB_ENV"

      - name: Install dbt packages
        run: dbt deps

      - name: Check the connection
        run: dbt debug

      - name: Build and test every layer
        run: dbt build

      - name: Keep the run logs for 7 days
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dbt-logs
          path: logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Remove the CI schemas
        if: always()
        run: dbt run-operation drop_ci_schemas
